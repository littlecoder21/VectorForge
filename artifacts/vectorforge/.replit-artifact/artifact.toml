kind = "web"
previewPath = "/"
title = "VectorForge"
description = "A mobile-first image-to-SVG workspace for cleaning raster images, vectorizing them into editable shapes, drawing SVG graphics, and exporting production-ready files."
version = "1.0.0"
id = "artifacts/vectorforge"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18417

[services.development]
run = "pnpm --filter @workspace/vectorforge run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/vectorforge", "run", "build" ]
serve = "static"
publicDir = "artifacts/vectorforge/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18417"
BASE_PATH = "/"
